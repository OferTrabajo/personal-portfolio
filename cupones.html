<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cupones</title>

    <style>
      body {
        margin: 0;
        background: black;
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        width: 100%;
        max-width: 500px;
        text-align: center;
      }

      .cupon {
        display: none;
        animation: fade 0.8s ease;
      }
      .cupon.active {
        display: block;
      }

      .cupon img {
        width: 90%;
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.45));
      }

      #buttons {
        margin-top: 30px;
        display: flex;
        justify-content: space-around;
      }

      button {
        background: #1da1ff;
        border: none;
        color: white;
        padding: 16px 36px;
        border-radius: 40px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
      }
      button:active {
        transform: scale(0.95);
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* POPUP */
      #popup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      #popupContent {
        background: #111;
        padding: 30px;
        border-radius: 20px;
        width: 80%;
        max-width: 350px;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        animation: pop 0.4s ease;
      }

      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      #popupContent h3 {
        color: white;
        margin-bottom: 15px;
      }

      #popupContent input {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 1rem;
      }

      #popupBtns {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="cupon active"><img src="cupones/cupon01.png" /></div>
      <div class="cupon"><img src="cupones/cupon02.png" /></div>
      <div class="cupon"><img src="cupones/cupon03.png" /></div>
      <div class="cupon"><img src="cupones/cupon04.png" /></div>

      <div id="buttons">
        <button onclick="next()">Siguiente</button>
        <button onclick="redeem()">Redimir</button>
      </div>
    </div>

    <div id="popup">
      <div id="popupContent">
        <h3 id="popupTitle"></h3>
        <input id="popupInput" />
        <div id="popupBtns">
          <button onclick="closePopup()">Cancelar</button>
          <button onclick="send()">Enviar</button>
        </div>
      </div>
    </div>

    <script>
      const phone = "573127378289";
      let index = 0;
      const cupons = document.querySelectorAll(".cupon");

      function next() {
        cupons[index].classList.remove("active");
        index = (index + 1) % cupons.length;
        cupons[index].classList.add("active");
      }

      function redeem() {
        if (index === 0) {
          openPopup("¿Qué película quieres ver?");
        } else if (index === 1) {
          openPopup("¿A qué restaurante quieres ir?");
        } else if (index === 2) {
          sendWhats("Cupón redimido por granizados 🍧");
        } else {
          sendWhats("Cupón redimido por canasta de dulces 🍬");
        }
      }

      function openPopup(title) {
        document.getElementById("popup").style.display = "flex";
        document.getElementById("popupTitle").innerText = title;
        document.getElementById("popupInput").value = "";
      }

      function closePopup() {
        document.getElementById("popup").style.display = "none";
      }

      function send() {
        const val = document.getElementById("popupInput").value;
        let msg = "";
        if (index === 0) {
          msg = `Cupón redimido por cine 🎬. Quiere ver: ${val}`;
        } else {
          msg = `Cupón redimido por restaurante 🍽️. Quiere ir a: ${val}`;
        }
        sendWhats(msg);
      }

      function sendWhats(text) {
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
        window.open(url, "_blank");
        closePopup();
      }
    </script>
  </body>
</html>
